services:
  drupalfflch:
    build: .
    container_name: drupalfflch
    ports:
      - "8000:80"
    depends_on:
      - mariadb
    networks:
      - drupalfflch-network
    volumes:
      - ./:/var/www/html
    environment:
      HOME: /tmp
#    user: "${UID:-1000}:${GID:-1000}"

  mariadb:
    image: mariadb:11
    container_name: drupalfflch_mariadb
    restart: always
    environment:
      MYSQL_DATABASE: drupalfflch
      MYSQL_USER: drupalfflch
      MYSQL_PASSWORD: drupalfflch
      MYSQL_ROOT_PASSWORD: drupalfflch
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - drupalfflch-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: drupalfflch_phpmyadmin
    restart: always
    depends_on:
      - mariadb
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: drupalfflch
    networks:
      - drupalfflch-network

  selenium:
    image: selenium/standalone-chrome
    container_name: drupalfflch_selenium
    ports:
      - "7900:7900"
    networks:
      - drupalfflch-network
    shm_size: 2gb

  # No /etc/hosts do seu computador colocar a linha `127.0.0.1 auth.local` 
  # particularidades do protocolo oAuth1 usado na USP
  senhaunica-faker:
    image: uspdev/senhaunica-faker
    container_name: drupalfflch_senhaunica-faker
    ports:
      - "3141:3141"
    environment:
          - APP_URL=http://auth.local:3141
    networks:
      drupalfflch-network:
        aliases:
          - auth.local

  mailpit:
    image: axllent/mailpit:latest
    container_name: drupalfflch_mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Interface Web
    networks:
      - drupalfflch-network

  garage:
    image: dxflrs/garage:v1.0.1
    container_name: drupalfflch_garage
    restart: always
    ports:
      - "3900:3900"   # API S3
      - "3901:3901"   # Comunicação RPC (Inter-nós e Cluster)
      - "3902:3902"   # S3 Web (Web Hosting de Buckets)
      - "3903:3903"   # API de Administração K2
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro   # Mapeamento do arquivo de configuração
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
    networks:
      - drupalfflch-network

networks:
  drupalfflch-network:

volumes:
  mariadb_data:
  garage_data:
  garage_meta:
