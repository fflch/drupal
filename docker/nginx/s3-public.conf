server {
    listen 80;
    server_name _;

    # Nunca expor arquivos privados pelo web endpoint
    location ~ ^/(drupal/)?private/ {
        return 403;
    }

    # /drupal/public/x.pdf  ->  /public/x.pdf
    location /drupal/ {
        rewrite ^/drupal/(.*)$ /$1 break;
        proxy_pass http://garage:3902;
        proxy_set_header Host drupal.web.garage.local;
    }

    # Caso a URL já venha sem o bucket
    location / {
        proxy_pass http://garage:3902;
        proxy_set_header Host drupal.web.garage.local;
    }
}